# @sveltejs/adapter-netlify writes the static site to `build/` and a
# `sveltekit-render` function (path "/*") to `.netlify/functions-internal/`.
# Netlify serves prerendered pages + assets statically and falls through to the
# function for dynamic routes like /api/signal — no manual redirects needed.
[build]
  command = "npm run build"
  publish = "build"

# Header names are lowercase here to match the `_headers` file the SvelteKit
# adapter generates — Netlify merges the two and warns if the same header shows
# up in two different cases.

# The worker script itself must never come back stale, or an installed app can
# sit on an old build after a deploy.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

# Signalling, ICE and push are live state. The service worker already refuses to
# cache them; this stops any proxy in between from doing so either.
[[headers]]
  for = "/api/*"
  [headers.values]
    cache-control = "no-store"
